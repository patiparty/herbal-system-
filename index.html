<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Herbal System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: sans-serif; background:#f5f5f5; }
.box { width:320px; margin:80px auto; padding:20px; background:white; border-radius:10px; }
input, button { width:100%; padding:10px; margin-top:10px; }
button { background:green; color:white; border:none; cursor:pointer; }
.hidden { display:none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">
<h2>Login</h2>
<input id="email" placeholder="email (admin@test.com)">
<input id="password" type="password" placeholder="password">
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div class="box hidden" id="app">
<h2>ระบบสมุนไพร</h2>
<p id="info"></p>
<button onclick="logout()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://yazocgdmovtlyvaqupkm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlhem9jZ2Rtb3Z0bHl2YXF1cGttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDA3MjQsImV4cCI6MjA5ODU3NjcyNH0.CFky0oKlzfK1ANPmRjQBpWC8JGfWRec9OKimzwbyEjg";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert("Login ไม่สำเร็จ");
    return;
  }

  currentUser = data.user;

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("info").innerText =
    "เข้าสู่ระบบ: " + currentUser.email;
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}
</script>

</body>
</html>
