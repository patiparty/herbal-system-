<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Herbal Login</title>
<style>
body { font-family: sans-serif; background:#f5f5f5; }
.box { width:300px; margin:100px auto; padding:20px; background:white; border-radius:10px; }
input, button { width:100%; padding:10px; margin-top:10px; }
button { background:green; color:white; border:none; cursor:pointer; }
</style>
</head>
<body>

<div class="box" id="loginBox">
<h2>Login</h2>

<input id="username" placeholder="username (admin / viewer)">
<input id="password" type="password" placeholder="password">

<button onclick="login()">Login</button>
</div>

<div class="box" id="app" style="display:none;">
<h2>ระบบสมุนไพร</h2>
<p id="info"></p>
<button onclick="logout()">Logout</button>
</div>

<script>
let currentUser = null;

function login(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;

  if(p !== "1234"){
    alert("รหัสผ่านไม่ถูกต้อง");
    return;
  }

  currentUser = u;

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("info").innerText =
    "ยินดีต้อนรับ: " + u;
}

function logout(){
  location.reload();
}
</script>

</body>
</html>
